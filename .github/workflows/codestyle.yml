name: codestyle check
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # This workflow checks only formatting. Installing the full GPU, MuJoCo,
      # and D4RL stack made the check fail before Ruff was ever invoked.
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.0.278
      - name: check codestyle
        run: |
          ruff --config pyproject.toml --diff .
